name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
  gate:
    runs-on: ubuntu-latest
    steps:
      - name: Ship gate
        env:
          SHIP_GATE: ${{ vars.SHIP_GATE }}
        run: test "$SHIP_GATE" != closed || { echo "SHIP_GATE is closed for this repository."; exit 1; }
